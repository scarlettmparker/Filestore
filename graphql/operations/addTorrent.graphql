mutation addTorrent($input: AddTorrentInput!) {
  filestoreMutations {
    addTorrent(input: $input) {
      message
      job {
        id
        bucket
        targetKeyPath
        sourceType
        status
        infoHash
        totalBytes
        downloadedBytes
        uploadedBytes
        progress
        downloadRateBps
        uploadRateBps
        peersConnected
        seedsConnected
        etaSeconds
        errorMessage
        createdAt
        completedAt
        magnetDetail {
          id
          infoHash
          infoHashVersion
          displayName
          sourceUri
          totalSize
          comment
          createdBy
          pieceLength
          pieceCount
          isPrivate
          trackers
          files {
            indexInTorrent
            path
            size
          }
        }
      }
    }
  }
}
