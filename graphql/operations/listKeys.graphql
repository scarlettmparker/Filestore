query listKeys($bucket: String!, $prefix: String) {
  filestoreQueries {
    listKeys(bucket: $bucket, prefix: $prefix) {
      key
      isDirectory
      size
      lastModified
      name
      description
      torrent {
        jobId
        status
        progress
        magnetDetailId
        downloadRateBps
        etaSeconds
        peersConnected
        errorMessage
      }
    }
  }
}
