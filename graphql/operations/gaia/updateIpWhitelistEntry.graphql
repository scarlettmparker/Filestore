mutation updateIpWhitelistEntry($id: ID!, $input: IpWhitelistEntryInput!) {
  gaiaMutations {
    updateIpWhitelistEntry(id: $id, input: $input) {
      ... on QuerySuccess {
        __typename
        message
        id
      }
      ... on StandardError {
        __typename
        message
      }
    }
  }
}
