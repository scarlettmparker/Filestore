mutation expireTailscaleDevice($id: ID!) {
  gaiaMutations {
    expireTailscaleDevice(id: $id) {
      message
      device {
        id
        headscaleId
        name
        ipv4
        status
        online
        expiredAt
        lastSeen
        createdAt
        updatedAt
      }
    }
  }
}
